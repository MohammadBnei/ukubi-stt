# Shift the compile check left. The image build takes ~15 minutes on the
# build-runner LXC pulling a multi-GB CUDA tree; a syntax error should not cost
# that. image.yml calls this on PRs and on pushes to main that are not
# docs/helm/k8s only, on the Talos runner (k8s-ubuntu-latest) with no GPU, and nothing
# after it (release, build, deploy) runs if it is red.
#
# It cannot prove CUDA engages — that is the startup assertion's job on real
# hardware, and no hosted runner has an RTX 2070. It proves the code compiles,
# is formatted, is clippy-clean and its pure helpers behave.
#
# Gate 0 PASSED on 2026-08-31 (3487 MiB resident, RTF 0.006), so the engine
# question is settled. What CI still cannot see is the runtime image: the
# failure that cost a day was a missing .so and a CUDA major mismatch, neither
# of which a `cargo clippy` on a hosted runner can reach.
name: ci

# Called by image.yml rather than triggered directly, so the checks and the release they
# gate happen in one run. Triggering here as well would run them twice on every push and
# leave the release depending on a different run than the one you are looking at.
on:
  # PRs run the checks here, on the Talos runner; main runs them through image.yml (workflow_call).
  pull_request:
  workflow_call:

jobs:
  # fmt, clippy, test and cargo audit come from ukubi-ci, pinned by sha. CI only proves
  # compile, format, lint, tests. Blocking audit ignores live in .cargo/audit.toml with
  # their reasons.
  #
  # No `--features cuda`: ukubi-stt declares no features; parakeet-rs/cuda is on
  # unconditionally in Cargo.toml, so a plain build compiles exactly what ships. An earlier
  # `--features cuda` failed with "the package 'ukubi-stt' does not contain this feature".
  #
  # apt-packages: tonic-prost-build needs protoc. The Dockerfile installs the same
  # protobuf-compiler package; keep the two in step.
  rust:
    uses: MohammadBnei/ukubi-ci/.github/workflows/rust-checks.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      apt-packages: protobuf-compiler

  # web/index.html is include_str!'d into the binary, so a syntax error in it compiles,
  # ships, and shows up only in a browser console. ukubi-ci has no equivalent.
  web:
    runs-on: k8s-ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the browser page parses
        run: node scripts/check-web-syntax.mjs
      # No package.json in this Rust repo, so the pinned Biome comes from npm (scripts/ and web/*.js).
      - name: Biome lint and format check
        run: npx --yes @biomejs/biome@2.6.4 ci .

  # The proto contract. Codegen stays in build.rs (tonic-prost-build); this only
  # lints the schema and refuses wire breaks against main. Same shape as
  # agent-fleet's go.yml, minus its "no proto/ on main yet" branch.
  buf:
    runs-on: k8s-ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # origin/main for buf breaking and for the BREAKING CHANGE: scan.
          fetch-depth: 0

      # A pinned release, checked by sha256. Not buf-setup-action: it looks the
      # release up through GitHub's API, unauthenticated from Forgejo, and the
      # runners' shared address hits the rate limit.
      - name: Install buf
        run: |
          set -euo pipefail
          v=1.72.0
          sha=8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
          curl -sSfLo "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v$v/buf-Linux-x86_64"
          echo "$sha  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: buf lint
        working-directory: proto
        run: buf lint

      # PRs only: on a push to main, HEAD is main. The PR payload, not
      # event_name, which Forgejo reports as workflow_call inside a called
      # workflow (so this step never ran there). A deliberate break
      # opts out by declaring `BREAKING CHANGE:` in a commit, which git-cliff
      # (ukubi-ci release) also reads as a breaking bump — the minor while on
      # 0.x — so the skip is visible in the version too.
      - name: buf breaking (against main)
        if: github.event.pull_request
        working-directory: proto
        run: |
          if git log --format='%B' origin/main..HEAD | grep -q '^BREAKING CHANGE:'; then
            echo "::notice::skipping buf breaking — a commit declares BREAKING CHANGE:"
            git log --format='%s' origin/main..HEAD | sed 's/^/  /'
            exit 0
          fi
          buf breaking --against '../.git#ref=origin/main,subdir=proto'

  # hadolint on the Dockerfile; no image build on a PR (owner decision, CI/CD split).
  dockerfile:
    uses: MohammadBnei/ukubi-ci/.github/workflows/dockerfile-lint.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      dockerfiles: Dockerfile
      # DL3008/DL4006 warnings in the CUDA image: only errors fail until they are fixed
      failure-threshold: error
