# Shift the compile check left. The image build takes ~15 minutes on the
# build-runner LXC pulling a multi-GB CUDA tree; a syntax error should not cost
# that. image.yml calls this on every PR and every push to main, on GitHub-hosted
# runners with no GPU, and nothing after it (release, build, deploy) runs if it
# is red.
#
# It cannot prove CUDA engages — that is the startup assertion's job on real
# hardware, and no hosted runner has an RTX 2070. It proves the code compiles,
# is formatted, is clippy-clean and its pure helpers behave.
#
# Gate 0 PASSED on 2026-08-31 (3487 MiB resident, RTF 0.006), so the engine
# question is settled. What CI still cannot see is the runtime image: the
# failure that cost a day was a missing .so and a CUDA major mismatch, neither
# of which a `cargo clippy` on a hosted runner can reach.
name: ci

# Called by image.yml rather than triggered directly, so the checks and the release they
# gate happen in one run. Triggering here as well would run them twice on every push and
# leave the release depending on a different run than the one you are looking at.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # dtolnay/rust-toolchain used to retry flaky downloads; the plain rustup
  # install below does not, so at least let cargo retry its own.
  CARGO_NET_RETRY: 10

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No arguments: installs exactly what rust-toolchain.toml names, components
      # included, so that file is the only place the version lives. Before
      # rust-cache, which keys on the rustc version. The second line fails the job
      # if the pin is not what is active (e.g. the file was not picked up).
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain | tee /dev/stderr | grep -q 'rust-toolchain.toml'

      # tonic-prost-build shells out to protoc, so build.rs fails without it.
      # ubuntu-latest does not ship it. The Dockerfile installs the same
      # package; keep the two in step.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      # Caches ~/.cargo and target/. The parakeet-rs -> ort -> ndarray/tokenizers
      # tree is the slow part and it changes only when Cargo.toml does.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # No --features flag. `--features` selects features of THIS package, and
      # ukubi-stt declares none — parakeet-rs/cuda is turned on unconditionally
      # in Cargo.toml, so a plain build already compiles exactly the program
      # that ships, ExecutionProvider::Cuda included. An earlier
      # `--features cuda` here failed with "the package 'ukubi-stt' does not
      # contain this feature", which is the distinction stated out loud.
      #
      # Whether ort 2.0.0-rc.13 resolves its CUDA build on a runner with no CUDA
      # toolkit is still genuinely unknown. If this fails inside ort's build
      # script rather than on our code, that is information Gate 0 wants, and
      # the fix is a real `cuda` feature on this package so CI can check the CPU
      # path while the image keeps the GPU one.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # web/index.html is include_str!'d into the binary, so a syntax error in it
      # compiles, ships, and shows up only in a browser console. One did: toPCM16
      # was both imported and redeclared, which kills the module at parse time and
      # made the whole page inert. It survived four releases because the only
      # check anyone ran was that `/` returned 200 — which it did throughout.
      - name: Check the browser page parses
        run: node scripts/check-web-syntax.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      # Blocking. A vulnerability fails `checks`, which stops release, build and
      # deploy on main. An accepted one goes in .cargo/audit.toml with its reason
      # and fixed version; this step is never made non-blocking. Warnings (unmaintained,
      # unsound) do not fail it. Two red modes are not advisories: "error loading
      # advisory database" means the pinned cargo-audit is too old for the DB
      # format — bump the pin above, do not ignore an ID; and a failed fetch of
      # the DB from GitHub is transient — re-run.
      - name: Audit
        run: cargo audit

  # The proto contract. Codegen stays in build.rs (tonic-prost-build); this only
  # lints the schema and refuses wire breaks against main. Same shape as
  # agent-fleet's go.yml, minus its "no proto/ on main yet" branch.
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # origin/main for buf breaking and for the BREAKING CHANGE: scan.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0

      - name: buf lint
        working-directory: proto
        run: buf lint

      # PRs only: on a push to main, HEAD is main. A called workflow sees the
      # caller's event, so this is image.yml's pull_request. A deliberate break
      # opts out by declaring `BREAKING CHANGE:` in a commit, which release-it
      # also reads as a major bump — so the skip is visible in the version too.
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: |
          if git log --format='%B' origin/main..HEAD | grep -q '^BREAKING CHANGE:'; then
            echo "::notice::skipping buf breaking — a commit declares BREAKING CHANGE:"
            git log --format='%s' origin/main..HEAD | sed 's/^/  /'
            exit 0
          fi
          buf breaking --against '../.git#ref=origin/main,subdir=proto'
