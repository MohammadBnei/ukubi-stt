# Shift the compile check left. image.yml only fires on a tag and takes ~15
# minutes on the build-runner LXC pulling a multi-GB CUDA tree; a syntax error
# should not cost that. This runs on every PR and push, on a GitHub-hosted
# runner, with no GPU involved.
#
# It cannot prove CUDA engages — that is the startup assertion's job on real
# hardware, and no hosted runner has an RTX 2070. It proves the code compiles,
# is formatted, is clippy-clean and its pure helpers behave.
#
# Gate 0 PASSED on 2026-08-31 (3487 MiB resident, RTF 0.006), so the engine
# question is settled. What CI still cannot see is the runtime image: the
# failure that cost a day was a missing .so and a CUDA major mismatch, neither
# of which a `cargo clippy` on a hosted runner can reach.
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # tonic-prost-build shells out to protoc, so build.rs fails without it.
      # ubuntu-latest does not ship it. The Dockerfile installs the same
      # package; keep the two in step.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      # Caches ~/.cargo and target/. The parakeet-rs -> ort -> ndarray/tokenizers
      # tree is the slow part and it changes only when Cargo.toml does.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # No --features flag. `--features` selects features of THIS package, and
      # ukubi-stt declares none — parakeet-rs/cuda is turned on unconditionally
      # in Cargo.toml, so a plain build already compiles exactly the program
      # that ships, ExecutionProvider::Cuda included. An earlier
      # `--features cuda` here failed with "the package 'ukubi-stt' does not
      # contain this feature", which is the distinction stated out loud.
      #
      # Whether ort 2.0.0-rc.13 resolves its CUDA build on a runner with no CUDA
      # toolkit is still genuinely unknown. If this fails inside ort's build
      # script rather than on our code, that is information Gate 0 wants, and
      # the fix is a real `cuda` feature on this package so CI can check the CPU
      # path while the image keeps the GPU one.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Advisory-only, and deliberately not blocking: this depends on an ort
      # release candidate by design (ADR-0044), so a clean audit is not
      # achievable on demand and a red X here would train people to ignore it.
      - name: Audit
        run: cargo audit || true
        continue-on-error: true
