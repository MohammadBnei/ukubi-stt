name: trailers

# Commit, title and body hygiene via MohammadBnei/ukubi-ci, pinned by sha.
# `edited` is listed so a title or body fix re-runs it; the latest event wins.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: trailers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trailers:
    uses: MohammadBnei/ukubi-ci/.github/workflows/trailers.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      conventional: true
      agent-trailers: pair
