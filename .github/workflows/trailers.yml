name: trailers

# Commit, title and body hygiene via MohammadBnei/ukubi-ci, pinned by sha.
# `edited` is listed so a title or body fix re-runs it; the latest event wins.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: trailers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trailers:
    uses: MohammadBnei/ukubi-ci/.github/workflows/trailers.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      conventional: true
      agent-trailers: pair
