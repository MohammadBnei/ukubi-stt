[package]
name = "ukubi-stt"
version = "0.10.2"
edition = "2021"
description = "GPU speech-to-text for ukubi-cluster (ADR-0044)"
license = "MIT"

[dependencies]
# `cuda` ENABLES the CUDA execution provider; it does NOT select it. Selection
# is ExecutionConfig::new().with_execution_provider(ExecutionProvider::Cuda) at
# load time — from_pretrained(path, None) silently defaults to CPU. Both halves
# are required. See src/engine.rs.
parakeet-rs = { version = "0.3.7", features = ["cuda"] }

# Pinned EXACTLY, not with a caret: ort is a release candidate (2.0.0-rc.13 is
# the newest published version; there is no stable release). A caret range on a
# pre-1.0 rc is how a build silently moves to a different ONNX Runtime ABI —
# and per ADR-0045 that ABI decides the base image, so it is not ours to float.
# `cuda` is named here rather than inherited: it resolves today only because
# parakeet-rs's own `cuda = ["ort/cuda"]` unifies across the graph, so
# `ort::ep::CUDA` compiles without this crate ever asking for it — and would
# vanish the day that crate reorganised its features. Declaring what we use turns
# a spooky future breakage into an ordinary one.
ort = "=2.0.0-rc.13"

anyhow = "1.0"
hound = "3.5"

# Both already resolve through parakeet-rs, so naming them here compiles no
# additional crates — but transitive availability is not importability, and a
# transitive version is not a promise. realfft in particular is the same FFT
# parakeet-rs uses for its own log-mel, so it is already exercised on this
# hardware. Pinned to the majors parakeet-rs asks for: with no Cargo.lock
# committed, a future realfft 4.0 would otherwise resolve ours to 4 while it
# stayed on 3, compiling both and quietly changing the transform underneath
# fbank.rs's golden vectors.
realfft = "3"
serde_json = "1"

# ORT explains itself at debug level — which provider it registered, which it
# declined, and why. ort routes those through `tracing`, parakeet-rs installs no
# subscriber, so on 2026-08-31 they went nowhere and Gate 0's failure had to be
# diagnosed by reading ort-sys's build script instead.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net"] }
tonic = "0.14"
# tonic 0.14 moved prost codec support into its own crate. The generated module
# references tonic_prost::ProstCodec, so this is not optional.
tonic-prost = "0.14"
# Serves the descriptor set build.rs emits, so any client can discover the API
# without a vendored .proto. Deliberately NOT reachable from outside: the
# IngressRoute matches PathPrefix(`/stt.v1.Stt/`) and reflection answers on
# `/grpc.reflection.v1.*`, so Traefik 404s it. In-cluster callers get it, the
# internet does not.
tonic-reflection = "0.14"
prost = "0.14"
axum = "0.8"

# Constant-time comparison for the bearer token. Hand-rolling this is four
# lines and the compiler is entitled to optimise the timing property back out;
# a purpose-built crate with no transitive dependencies is the cheaper correct
# answer on a security path.
subtle = "2.6"

[build-dependencies]
tonic-prost-build = "0.14"
