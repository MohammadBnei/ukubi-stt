syntax = "proto3";

package stt.v1;

// GPU speech-to-text. ADR-0044.
//
// Phase 1 is ONE unary RPC, deliberately. Browsers cannot do gRPC client- or
// bidirectional streaming — gRPC-Web and Connect give unary and
// server-streaming only, and `duplex: 'full'` fetch ships in no stable browser
// as of 2026. So realtime is chunked unary at utterance granularity: one
// transport, one auth path, no partials.
//
// There is STILL only one RPC, and that is the point: realtime is the same
// unary call carrying a session_id. Browsers cannot stream *up* under any
// transport gRPC offers, so the audio goes as discrete requests regardless —
// which means a streaming RPC would buy nothing and cost a second code path.
// ADR-0046 Decision 3.
service Stt {
  rpc Recognize(RecognizeRequest) returns (RecognizeResponse);
}

message RecognitionConfig {
  // 16000 only. The model is 16 kHz mono; anything else is rejected rather
  // than resampled, because a silently resampled request returns a plausible
  // transcript and a meaningless real-time factor.
  int32 sample_rate_hertz = 1;

  // Parakeet TDT v3 auto-detects across its 25 languages, so this is accepted
  // and unused today. It becomes the routing key when a second model lands for
  // Persian/Arabic (ADR-0044 Consequences) — which is why it is in the wire
  // format now, when it is free, rather than later, when it is a migration.
  string language = 2;
}

message RecognizeRequest {
  RecognitionConfig config = 1;

  // Mono little-endian signed 16-bit PCM. No container, no encoding enum —
  // the caller has already decided what it is sending, and a format field
  // whose only legal value is one thing is a field that lies.
  //
  // Capped at 16 MB by max_decoding_message_size (~8 minutes at 16 kHz).
  bytes audio = 2;

  // Empty means a one-shot offline decode against the batch model: the whole
  // request is the whole utterance, and nothing is remembered.
  //
  // Non-empty selects REALTIME. The server keeps a streaming recognizer keyed
  // by this id, so each ~560ms chunk continues the previous one instead of
  // being decoded in isolation. Chunks must arrive in order — they are audio,
  // and the encoder carries cache forward.
  //
  // Note this id is client-chosen and the bearer token is shared, so any
  // caller who guesses another's id can interleave audio into it. Accepted at
  // this trust boundary and recorded in ADR-0046; it stops being acceptable
  // the moment tokens become per-client.
  string session_id = 3;

  // offset_ms was reserved for a stateless stitching design that server-side
  // session state made unnecessary — the server knows where it is in the
  // stream. Kept reserved rather than reused, so an old client's field 4 can
  // never be silently reinterpreted.
  reserved 4;
  reserved "offset_ms";

  // Ends the session and releases its recognizer. Sessions are also swept on
  // idle, because browsers close tabs without saying goodbye and that is the
  // normal case rather than the edge.
  bool last = 5;
}

message RecognizeResponse {
  string text = 1;

  // These two exist so any client can compute the real-time factor itself.
  // The failure this service is most prone to is decoding correctly on the
  // wrong device, which looks like success in every way except speed — so the
  // number that reveals it is part of the contract, not a debug log.
  //
  // In streaming mode they describe THIS CHUNK, not the session. A client that
  // wants a session-wide figure accumulates them, which it has to do anyway to
  // display a running transcript.
  float audio_seconds = 2;
  float decode_seconds = 3;

  // There is deliberately no `is_final`. The streaming model returns the new
  // text for each chunk rather than a revised running hypothesis, so the client
  // concatenates and never has to replace a tail. An engine that revises would
  // need this field and a very different client — see ADR-0046 Consequences.
}
